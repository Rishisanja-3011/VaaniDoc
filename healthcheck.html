<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VaaniDoc - Health Check</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
    h1 { color: #2d6a4f; }
    .status { padding: 10px 16px; border-radius: 6px; margin: 8px 0; font-weight: bold; }
    .ok   { background: #d8f3dc; color: #1b4332; }
    .fail { background: #ffe0e0; color: #7f1d1d; }
    .pending { background: #fff3cd; color: #856404; }
    button { margin-top: 20px; padding: 10px 20px; background: #2d6a4f; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>
  <h1>🩺 VaaniDoc — Website Check</h1>
  <p>Checks connectivity to each service endpoint.</p>

  <div id="results"></div>
  <button onclick="runChecks()">Run Checks</button>

  <script>
    const ENDPOINTS = [
      { name: "Patient App",       url: "http://localhost:5173" },
      { name: "Doctor Dashboard",  url: "http://localhost:5174" },
      { name: "Backend API",       url: "http://localhost:8000/health" },
    ];

    async function checkUrl(url) {
      try {
        const res = await fetch(url, { mode: "no-cors", signal: AbortSignal.timeout(3000) });
        return "ok";
      } catch {
        return "fail";
      }
    }

    async function runChecks() {
      const container = document.getElementById("results");
      container.innerHTML = "";

      for (const ep of ENDPOINTS) {
        const div = document.createElement("div");
        div.className = "status pending";
        div.textContent = `⏳ Checking ${ep.name}...`;
        container.appendChild(div);

        const result = await checkUrl(ep.url);
        div.className = `status ${result}`;
        div.textContent = result === "ok"
          ? `✅ ${ep.name} — reachable`
          : `❌ ${ep.name} — not reachable (${ep.url})`;
      }
    }

    runChecks();
  </script>
</body>
</html>
